<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniVCS - Repositories</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>MiniVCS</h1>
    <nav class="tabs" aria-label="Screens">
      <a class="tab" href="index.html">History</a>
      <a class="tab active" href="repositories.html">Repositories</a>
      <a class="tab" href="retention.html">Retention</a>
    </nav>
  </header>
  <main>
    <p id="msg" class="msg" role="status" hidden></p>
    <h2>Remote repository</h2>
    <div class="panel">
      <label for="remotePath">Remote folder</label>
      <input id="remotePath" value="remote/" readonly>
      <div class="btnrow">
        <button id="btnClone">Clone</button>
        <button id="btnPush" class="primary">Push</button>
        <button id="btnPull">Pull</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="k">Local snapshots</span><span class="v" id="statLocal">0</span></div>
      <div class="stat"><span class="k">Remote snapshots</span><span class="v" id="statRemote">0</span></div>
      <div class="stat"><span class="k">Waiting to push</span><span class="v" id="statAhead">0</span></div>
      <div class="stat"><span class="k">Waiting to pull</span><span class="v" id="statBehind">0</span></div>
    </div>

<h3>Upload and commit a file</h3>

<div class="panel">
  <label for="repositoryId">Repository ID</label>
  <input
    id="repositoryId"
    type="number"
    min="1"
    placeholder="Example: 1"
  >

  <label for="filePath">Repository file path</label>
  <input
    id="filePath"
    placeholder="Example: docs/readme.txt"
  >

  <label for="fileInput">Select file</label>
  <input
    id="fileInput"
    type="file"
  >

  <div class="btnrow">
    <button id="btnUpload" class="primary">
      Upload and stage
    </button>
  </div>

  <label for="commitMessage">Commit message</label>
  <input
    id="commitMessage"
    placeholder="Describe this change"
  >

  <div class="btnrow">
    <button id="btnCreateCommit" class="primary">
      Create commit
    </button>
  </div>

  <p id="uploadMessage" class="msg" role="status" hidden></p>
</div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
