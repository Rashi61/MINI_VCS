<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniVCS - Retention</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>MiniVCS</h1>
    <nav class="tabs" aria-label="Screens">
      <a class="tab" href="index.html">Home</a>
      <a class="tab" href="repositories.html">Repositories</a>
      <a class="tab" href="history.html">History</a>
      <a class="tab active" href="retention.html">Retention</a>
      <a class="tab" href="public-repositories.html">Explore</a>
    </nav>
  </header>
  <main>
    <p id="msg" class="msg" role="status" hidden></p>
    <h2>Smart version retention</h2>

    <div class="panel">
      <label for="repoSelect">Repository</label>
      <select id="repoSelect">
        <option value="">Loading repositories...</option>
      </select>

      <label for="days">Keep snapshots for (days)</label>
      <input id="days" type="number" min="1" max="3650" value="30">
      <div class="btnrow">
        <button id="btnSaveDays" class="primary" type="button">
          Save retention period
        </button>
      </div>
    </div>

    <p class="note">
      Only owners and maintainers can change the retention period or delete
      expired snapshots. The newest commit and every branch tip are always kept.
    </p>

    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>Snapshot</th><th>Date</th><th>Age</th><th>Result</th></tr>
        </thead>
        <tbody id="retentionRows"></tbody>
      </table>
    </div>
    <p id="empty" class="hint" hidden>No snapshots to check.</p>

    <button id="btnCleanup" class="wide primary" type="button">
      Delete expired snapshots
    </button>
  </main>
  <script src="js/api.js"></script>
  <script src="js/repo-picker.js"></script>
  <script src="js/retention.js"></script>
</body>
</html>
