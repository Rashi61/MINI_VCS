<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniVCS - Retention</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>MiniVCS</h1>
    <nav class="tabs" aria-label="Screens">
      <a class="tab" href="index.html">History</a>
      <a class="tab" href="repositories.html">Repositories</a>
      <a class="tab active" href="retention.html">Retention</a>
    </nav>
  </header>
  <main>
    <p id="msg" class="msg" role="status" hidden></p>
    <h2>Smart version retention</h2>
    <div class="panel">
      <label for="days">Keep snapshots for (days)</label>
      <input id="days" type="number" min="0" value="7">
      <div class="btnrow"><button id="btnSaveDays" class="primary">Save retention period</button></div>
    </div>

    <p id="pending" class="note"></p>

    <div class="tablewrap">
      <table>
        <thead><tr><th>Snapshot</th><th>Age</th><th>Result</th></tr></thead>
        <tbody id="retentionRows"></tbody>
      </table>
    </div>
    <p id="empty" class="hint" hidden>No snapshots to check.</p>

    <button id="btnCleanup" class="wide primary">Delete expired snapshots</button>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
