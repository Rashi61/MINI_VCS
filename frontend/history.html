<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniVCS - Commit history</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>MiniVCS</h1>
    <nav class="tabs" aria-label="Screens">
      <a class="tab" href="index.html">Home</a>
      <a class="tab" href="repositories.html">Repositories</a>
      <a class="tab active" href="history.html">History</a>
      <a class="tab" href="retention.html">Retention</a>
      <a class="tab" href="public-repositories.html">Explore</a>
    </nav>
  </header>
  <main>
    <p id="msg" class="msg" role="status" hidden></p>
    <h2>Commit history</h2>
    <p class="hint">Shows the commits of the branch currently checked out in the repository.</p>

    <div class="panel">
      <label for="repoSelect">Repository</label>
      <select id="repoSelect">
        <option value="">Loading repositories...</option>
      </select>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>Commit</th>
            <th>Message</th>
            <th>Date</th>
            <th>Type</th>
          </tr>
        </thead>
        <tbody id="historyRows"></tbody>
      </table>
    </div>
    <p id="empty" class="hint" hidden>No commits yet. Upload and commit a file on the Repositories page.</p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/repo-picker.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
